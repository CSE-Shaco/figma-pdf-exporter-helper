name: Build local font helper

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.sh'
      - '*.command'
      - '*.cmd'
      - '*.ps1'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'licenses/**'
      - '.github/workflows/font-helper-build.yml'

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify native Python architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 -c 'import os, platform; assert platform.machine() == os.environ["TARGET_ARCH"]'
      - name: Test helper
        run: python3 -m unittest discover -s . -p 'test_*.py'
      - name: Build standalone executable
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./build-macos.sh
      - name: Test standalone executable against OS fonts
        run: python3 smoke-binary.py dist/font-helper-macos-${{ matrix.arch }}
      - name: Package executable and launcher
        env:
          HELPER_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "package/font-helper-macos-$HELPER_ARCH/dist"
          cp "dist/font-helper-macos-$HELPER_ARCH" "package/font-helper-macos-$HELPER_ARCH/dist/"
          cp start-macos.command README.md LICENSE "package/font-helper-macos-$HELPER_ARCH/"
          cd package
          zip -r "font-helper-macos-$HELPER_ARCH.zip" "font-helper-macos-$HELPER_ARCH"
          shasum -a 256 "font-helper-macos-$HELPER_ARCH.zip" > "font-helper-macos-$HELPER_ARCH.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: font-helper-macos-${{ matrix.arch }}-ci
          path: |
            package/*.zip
            package/*.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test helper
        run: python -m unittest discover -s . -p test_*.py
      - name: Test built-in Windows PowerShell helper
        shell: powershell
        run: ./test-windows.ps1
      - name: Build standalone executable
        shell: cmd
        run: build-windows.cmd
      - name: Test standalone executable against OS fonts
        run: python smoke-binary.py dist/font-helper-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: font-helper-windows-ci
          path: dist/font-helper-windows.exe
          if-no-files-found: error
          retention-days: 14
